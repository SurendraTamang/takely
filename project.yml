name: Takely
options:
  bundleIdPrefix: app.takely
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Takely.xcconfig
  Release: Config/Takely.xcconfig
packages:
  TakelyKit:
    path: Packages/TakelyKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Apple silicon only: the prebuilt WebRTC AEC3 library (and the app's requirements) are arm64.
    ARCHS: arm64
targets:
  Takely:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: TakelyKit
        product: ProjectKit
      - package: TakelyKit
        product: CaptureKit
      - package: TakelyKit
        product: RenderKit
      - package: TakelyKit
        product: AppCore
      - package: TakelyKit
        product: TakelyControl
      - package: TakelyKit
        product: ShareKit
      # The `takely` command-line tool, shipped inside the app as Contents/Helpers/takely (not in Contents/MacOS:
      # the file system ignores case, so it would replace the app's own `Takely` executable).
      - target: takely-cli
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Takely
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSScreenCaptureUsageDescription: Takely records your screen when you start a recording.
        NSCameraUsageDescription: Takely shows your camera in a bubble on your recordings.
        NSMicrophoneUsageDescription: Takely records your voice with your recordings.
        CFBundleURLTypes:
          - CFBundleURLName: app.takely.automation
            CFBundleURLSchemes: [takely]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.takely.recording
            UTTypeDescription: Takely Recording
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [takely]
    entitlements:
      path: App/Takely.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.takely.Takely
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  takely-cli:
    type: tool
    platform: macOS
    sources: [Packages/TakelyKit/Sources/takely]
    dependencies:
      - package: TakelyKit
        product: TakelyControl
    settings:
      base:
        PRODUCT_NAME: takely
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
