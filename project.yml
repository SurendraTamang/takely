name: Takely
options:
  bundleIdPrefix: app.takely
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Takely.xcconfig
  Release: Config/Takely.xcconfig
packages:
  TakelyKit:
    path: Packages/TakelyKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  # Updates (EdDSA-signed appcast). Off unless TAKELY_APPCAST_URL and TAKELY_SPARKLE_PUBLIC_KEY are set.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  # The official Model Context Protocol SDK, for `takely-mcp` (AI agents).
  MCPSwiftSDK:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: 0.11.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Apple silicon only: the prebuilt WebRTC AEC3 library (and the app's requirements) are arm64.
    ARCHS: arm64
targets:
  Takely:
    type: application
    platform: macOS
    sources:
      - App
      # Third-party license texts, shown in Settings › General › Acknowledgements.
      - path: Licenses
        type: folder
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: TakelyKit
        product: ProjectKit
      - package: TakelyKit
        product: CaptureKit
      - package: TakelyKit
        product: RenderKit
      - package: TakelyKit
        product: AppCore
      - package: TakelyKit
        product: TakelyControl
      - package: TakelyKit
        product: ShareKit
      # The `takely` command-line tool, shipped inside the app as Contents/Helpers/takely (not in Contents/MacOS:
      # the file system ignores case, so it would replace the app's own `Takely` executable).
      - target: takely-cli
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # `takely-mcp`, the MCP server AI agents launch (Contents/Helpers/takely-mcp).
      - target: takely-mcp
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Takely
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSScreenCaptureUsageDescription: Takely records your screen when you start a recording.
        NSCameraUsageDescription: Takely shows your camera in a bubble on your recordings.
        NSMicrophoneUsageDescription: Takely records your voice with your recordings.
        NSCalendarsFullAccessUsageDescription: Takely names meeting recordings after the calendar event under way, if you turn this on.
        SUFeedURL: $(TAKELY_APPCAST_URL)
        SUPublicEDKey: $(TAKELY_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.takely.automation
            CFBundleURLSchemes: [takely]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.takely.recording
            UTTypeDescription: Takely Recording
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [takely]
    entitlements:
      path: App/Takely.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.takely.Takely
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  takely-mcp:
    type: tool
    platform: macOS
    sources: [Packages/TakelyKit/Sources/takely-mcp]
    dependencies:
      - package: TakelyKit
        product: TakelyMCPKit
      - package: TakelyKit
        product: TakelyControl
      - package: MCPSwiftSDK
        product: MCP
    settings:
      base:
        PRODUCT_NAME: takely-mcp
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  takely-cli:
    type: tool
    platform: macOS
    sources: [Packages/TakelyKit/Sources/takely]
    dependencies:
      - package: TakelyKit
        product: TakelyControl
    settings:
      base:
        PRODUCT_NAME: takely
        # Copied into the app (Contents/Helpers), not installed on its own: an archive must hold only the app.
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
